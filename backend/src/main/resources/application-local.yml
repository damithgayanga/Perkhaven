spring:
  datasource:
    url: jdbc:h2:file:./data/perkhaven;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/local

logging:
  level:
    com.perkhaven: INFO
