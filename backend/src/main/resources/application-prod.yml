spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/prod
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PERKHAVEN_SECURITY_COGNITO_ISSUER}

perkhaven:
  security:
    cognito:
      user-pool-id: ${PERKHAVEN_SECURITY_COGNITO_USER_POOL_ID:}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    bucket: ${PERKHAVEN_STORAGE_BUCKET}

  mail:
    provider: ${PERKHAVEN_MAIL_PROVIDER:local}
    from: ${PERKHAVEN_MAIL_FROM:no-reply@perkhaven.invalid}
    reply-to: ${PERKHAVEN_MAIL_REPLY_TO:}
  student-portal-url: ${PERKHAVEN_STUDENT_PORTAL_URL:https://student.perkhaven.lk}
