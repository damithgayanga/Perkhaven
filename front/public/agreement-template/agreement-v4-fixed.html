after 8 pm unless permission is granted and informed to the </text><text x="94.450" y="340.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Hostel Warden or Proprietor by a parent/guardian of the Resident for the specific day.</text><text x="57.000" y="355.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.8</text><text x="94.450" y="355.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">If the Resident has any known medical conditions, it must be informed to the Hostel Warden and should be </text><text x="94.450" y="366.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">mentioned in the Registration form submitted by the Resident.</text><text x="57.000" y="382.151" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">2.0</text><text x="94.450" y="382.151" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Cleanliness of the Hostel and Hostel Rooms</text><text x="57.000" y="397.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.1</text><text x="94.450" y="397.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Residents are always responsible for the keeping, cleanliness and tidiness of their rooms, including the </text><text x="94.450" y="408.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">common kitchen. The Resident must wash all the dishes once she finishes cooking in the kitchen.</text><text x="57.000" y="424.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.2</text><text x="94.450" y="424.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">All fans, lights &amp; electrical appliances must be switched off when not in use or when leaving the room. (Do not </text><text x="94.450" y="434.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">use fans to dry wet clothes).</text><text x="57.000" y="450.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.3</text><text x="94.450" y="450.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident shall not use any cooking and heating appliances (Hot plates, Infrared cookers, Induction cookers </text><text x="94.450" y="461.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">and Heaters) inside the Hostel Rooms and shall be used only in common kitchens. However, the Resident is </text><text x="94.450" y="472.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">allowed to use an electric kettle inside the Hostel Room subject to obtaining prior approval from the Hostel </text><text x="94.450" y="483.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Warden.</text><text x="57.000" y="498.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.4</text><text x="94.450" y="498.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Use of water heaters is strictly prohibited within the Hostel and Hostel Rooms. A serious or repeated breach of </text><text x="94.450" y="509.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">this rule may result in termination of the Resident's accommodation in accordance with Clause 7.5 of the Hostel </text><text x="94.450" y="520.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation Agreement. Any loss or damage caused by such breach may be recovered from the Resident </text><text x="94.450" y="531.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">in accordance with the Agreement.</text><text x="57.000" y="547.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.5</text><text x="94.450" y="547.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Where Allocated Accommodation provided on a sharing basis is not fully occupied (2 or 3 persons based on </text><text x="94.450" y="557.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">capacity), the Resident shall not use any unallocated beds, tables, cupboards or racks. The Resident shall </text><text x="94.450" y="568.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">ensure that the room is clean and tidy at all times and when displaying to new residents.</text><text x="57.000" y="584.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.6</text><text x="94.450" y="584.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Residents should dispose of garbage, including waste food, polythene, paper and sanitary napkins into the </text><text x="94.450" y="595.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">respective bins placed on the Hostel premises. (Please contact the Hostel Warden regarding any clarification </text><text x="94.450" y="606.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">on the above). Should there be a block of the drainage pipes due to the negligent disposal of sanitary napkins </text><text x="94.450" y="617.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">by&#160; Resident(s),&#160; the&#160; relevant&#160; Resident(s)&#160; shall&#160; reimburse&#160; reasonable&#160; repair&#160; cost&#160; plus&#160; the&#160; applicable </text><text x="94.450" y="628.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">administration fee under the Agreement.</text><text x="57.000" y="643.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.7</text><text x="94.450" y="643.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident is responsible for the proper care of the items/equipment and facilities provided inside the Hostel </text><text x="94.450" y="654.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Room and common kitchen. In case of any loss/damage to any Hostel Room caused by the Resident, the </text><text x="94.450" y="665.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Proprietor has the right to claim the rectification cost of the loss/damage from the Resident. The Resident shall </text><text x="94.450" y="676.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">reimburse reasonable repair cost plus the applicable administration fee under the Agreement to rectify the </text><text x="94.450" y="687.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">damage.</text><text x="57.000" y="702.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.8</text><text x="94.450" y="702.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Where loss or damage occurs to a shared Hostel Room, common area or shared item, the Proprietor may </text><text x="94.450" y="713.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">recover the reasonable rectification cost from the Resident or Residents whose responsibility for such loss or </text><text x="94.450" y="724.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">damage is reasonably established. Where damage is jointly caused by more than one Resident, the reasonable </text><text x="94.450" y="735.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">cost may be apportioned between the responsible Residents.</text><text x="57.000" y="751.151" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">3.0</text><text x="94.450" y="751.151" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Security of Personal Items</text><text x="57.000" y="766.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.1</text><text x="94.450" y="766.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Residents are fully responsible for all of their personal belongings and valuable items such as mobile </text><text x="94.450" y="777.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">phones, laptops, watches, money, jewellery etc. The Residents shall ensure that the doors and windows of the </text><text x="94.450" y="788.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Allocated Accommodation are properly closed. The Proprietor, the Proprietor’s Representative, and the Hostel </text><text x="94.450" y="799.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Warden may provide reasonable assistance to the Resident to find any lost item. However, the Proprietor, the </text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">8</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="94.450" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Proprietor’s Representative, the Hostel Warden, or any other person working in the Hostel premises cannot be </text><text x="94.450" y="143.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">held responsible by the Resident for the loss of personal items. Accordingly, the risk of loss, theft or damage to </text><text x="94.450" y="154.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Resident’s personal belongings shall be borne by the Resident and not by the Proprietor, except to the </text><text x="94.450" y="165.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">extent that such liability cannot lawfully be excluded.</text><text x="57.000" y="180.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.2</text><text x="94.450" y="180.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Where the Proprietor has reasonable grounds to believe that a Resident has been involved in theft or other </text><text x="94.450" y="191.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">serious illegal conduct, the Proprietor may terminate the Resident's accommodation in accordance with Clause </text><text x="94.450" y="202.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.5 and may report the matter to the relevant authorities where appropriate. Any Security Deposit shall be dealt </text><text x="94.450" y="213.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">with in accordance with Clause 4.0 of the Agreement and shall not be automatically forfeited solely by reason of </text><text x="94.450" y="224.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">termination.</text><text x="57.000" y="239.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.3</text><text x="94.450" y="239.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">If the Resident damages or misplaces a smart card or key, the Resident shall pay the following replacement </text><text x="94.450" y="250.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">charge:</text><text x="94.450" y="266.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">a.</text><text x="120.350" y="266.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Smart Card – 3,000 rupees;</text><text x="94.450" y="280.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">b.</text><text x="120.350" y="280.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Key of the Toilet Door – 2,000 rupees;</text><text x="94.450" y="294.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">c.</text><text x="120.350" y="294.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Key of the Cupboard Door – 2,000 rupees.</text><text x="57.000" y="308.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.4</text><text x="94.450" y="308.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Visitors, including parents, may enter the Hostel or Hostel Room only with the prior permission of the Hostel </text><text x="94.450" y="319.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Warden.</text><text x="57.000" y="334.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.5</text><text x="94.450" y="334.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">No visitors are allowed to stay overnight without any permission from the Hostel Warden.</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><line x1="65.250" y1="181.751" x2="530.150" y2="181.751" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="209.851" x2="529.650" y2="209.851" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="220.151" x2="529.650" y2="220.151" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="230.951" x2="529.650" y2="230.951" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="241.851" x2="529.650" y2="241.851" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="252.651" x2="529.650" y2="252.651" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="263.551" x2="529.650" y2="263.551" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="274.351" x2="529.650" y2="274.351" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="285.251" x2="529.650" y2="285.251" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="296.051" x2="529.650" y2="296.051" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="306.951" x2="529.650" y2="306.951" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="317.251" x2="529.650" y2="317.251" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="328.051" x2="529.650" y2="328.051" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="338.951" x2="529.650" y2="338.951" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="349.751" x2="529.650" y2="349.751" stroke="rgb(0,0,0)" stroke-width="0.500"/><line x1="65.750" y1="368.651" x2="529.
