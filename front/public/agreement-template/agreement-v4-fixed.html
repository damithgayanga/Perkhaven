<!doctype html><html><head><meta charset="utf-8"><style>@page{size:595.304pt 841.890pt;margin:0}html,body{margin:0;padding:0;background:#fff}.page{position:relative;width:595.304pt;height:841.890pt;page-break-after:always;break-after:page;overflow:hidden;background:white}.page:last-child{page-break-after:auto;break-after:auto}svg{display:block;width:100%;height:100%}text{font-family:"Liberation Sans",Arial,sans-serif;fill:#000}</style></head><body><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="181.500" y="134.651" font-size="8.625pt" font-weight="700" font-style="normal" xml:space="preserve">HOSTEL ACCOMMODATION AGREEMENT</text><text x="57.000" y="155.501" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">1.0</text><text x="94.450" y="155.501" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Definitions</text><text x="57.000" y="170.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.1</text><text x="94.450" y="170.951" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Proprietor”</text><text x="146.950" y="170.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> –&#160; The&#160; Proprietor&#160; is&#160; Mrs.&#160; Warnakulasooriya&#160; Nadeesha&#160; Joanne&#160; Kumari&#160; Fernando&#160; (NIC </text><text x="94.450" y="181.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">877382915V), and includes any Proprietor's Representative acting within the authority granted by the Proprietor </text><text x="94.450" y="192.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">under this Hostel Accommodation Agreement or under a valid power of attorney.</text><text x="57.000" y="208.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.2</text><text x="94.450" y="208.301" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Proprietor’s Representative”</text><text x="221.800" y="208.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Proprietor’s Representative is Mahesh Tishantha (NIC 792272428V), or </text><text x="94.450" y="219.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">any other person appointed or authorised by the Proprietor in writing, including by a valid power of attorney, to </text><text x="94.450" y="230.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">act on behalf of the Proprietor in relation to the management, administration, enforcement, operation, receipt of </text><text x="94.450" y="241.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">notices, collection or verification of payments, and performance of any rights or obligations of the Proprietor </text><text x="94.450" y="252.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">under this Hostel Accommodation Agreement.</text><text x="57.000" y="267.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.3</text><text x="94.450" y="267.551" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Resident”</text><text x="141.450" y="267.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Resident is {{studentName}} (NIC – {{studentId}}).</text><text x="57.000" y="283.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.4</text><text x="94.450" y="283.001" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Hostel Warden”</text><text x="168.650" y="283.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Hostel Warden is {{wardenName}} (NIC {{wardenId}}) or any other person appointed by the </text><text x="94.450" y="293.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Proprietor or the Proprietor’s Representative as the Hostel Warden to manage the operations of the Hostel.</text><text x="57.000" y="309.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.5</text><text x="94.450" y="309.401" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Party” or “Parties”</text><text x="182.400" y="309.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Proprietor, acting personally or through the Proprietor’s Representative where </text><text x="94.450" y="320.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">applicable, and the Resident, being herein referred to individually as a “Party” and collectively as “Parties”.</text><text x="57.000" y="335.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.6</text><text x="94.450" y="335.801" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Hostel”</text><text x="130.950" y="335.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Hostel is the managed accommodation facility known as “The Perk Haven”, owned by the </text><text x="94.450" y="346.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Proprietor and located at 13/2/Q, Iriyagaha Kumbura, Pitipana North, Homagama, at which accommodation </text><text x="94.450" y="357.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">and common facilities are provided to Residents subject to the management, supervision and Hostel Rules of </text><text x="94.450" y="368.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Proprietor.</text><text x="57.000" y="384.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.7</text><text x="94.450" y="384.101" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Hostel Room”</text><text x="159.350" y="384.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – A Hostel Room means any room within the Hostel designated as Room Numbers 101, 102, </text><text x="94.450" y="395.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">103, 104, 201, 202, 203, 204, 205, 206, 207, 208, 209, 301, 302, 303, 304, 305, 306, 307, 308, 309, 401, 402, </text><text x="94.450" y="406.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">403, 404, 405 and 406, or any other room designated by the Proprietor for accommodation purposes. A Hostel </text><text x="94.450" y="416.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Room forms part of the managed Hostel and is not separately let, leased or transferred to the Resident.</text><text x="57.000" y="432.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.8</text><text x="94.450" y="432.401" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Hostel&#160; Accommodation&#160; Agreement”</text><text x="260.100" y="432.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> –&#160; This&#160; Agreement,&#160; together&#160; with&#160; Appendix&#160; 1&#160; and&#160; Appendix&#160; 2, </text><text x="94.450" y="443.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">constitutes the contractual arrangement under which the Proprietor provides managed hostel accommodation </text><text x="94.450" y="454.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">and associated facilities to the Resident subject to the terms and conditions contained herein.</text><text x="57.000" y="469.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.9</text><text x="94.450" y="469.751" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Accommodation Start Date”</text><text x="219.700" y="469.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Accommodation Start Date is {{startDate}}, being the date on which the </text><text x="94.450" y="480.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Resident's accommodation under this Agreement commences.</text><text x="57.000" y="496.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.10</text><text x="94.450" y="496.151" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Accommodation Period”</text><text x="204.900" y="496.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Accommodation Period shall commence on the Accommodation Start Date. </text><text x="94.450" y="507.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident agrees to a minimum contractual stay of Six (6) months from the Accommodation Start Date </text><text x="94.450" y="518.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">(“Minimum Stay Period”), unless an earlier termination is expressly agreed by the Proprietor in writing or </text><text x="94.450" y="529.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">otherwise occurs in accordance with this Agreement. Any extension beyond the Minimum Stay Period shall be </text><text x="94.450" y="539.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">subject to the approval of the Proprietor.</text><text x="57.000" y="555.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.11</text><text x="94.450" y="555.401" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Accommodation Fee”</text><text x="194.400" y="555.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Accommodation Fee means the amount payable by the Resident to the </text><text x="94.450" y="566.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Proprietor for the provision of hostel accommodation, use of the allocated facilities and such common facilities </text><text x="94.450" y="577.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">and services as are made available under this Agreement.</text><text x="57.000" y="592.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.12</text><text x="94.450" y="592.751" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Monthly Accommodation Fee”</text><text x="229.150" y="592.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Monthly Accommodation Fee applicable to the accommodation initially </text><text x="94.450" y="603.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">allocated to the Resident under this Agreement shall be LKR {{monthlyRent}} ({{monthlyRentWords}}). </text><text x="94.450" y="614.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident is initially allocated Room/Bed {{roomNo}} on the single/sharing basis specified in the Resident's </text><text x="94.450" y="625.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">accommodation details. The Monthly Accommodation Fee shall remain fixed during the Minimum Stay Period. </text><text x="94.450" y="636.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Any fee applicable to an approved extension of the Accommodation Period shall be communicated and agreed </text><text x="94.450" y="647.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">in writing.</text><text x="57.000" y="662.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.13</text><text x="94.450" y="662.951" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Security Deposit”</text><text x="174.850" y="662.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Security Deposit means the amount paid by the Resident as security for the proper </text><text x="94.450" y="673.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">performance of the Resident's obligations under this Agreement, including payment of Accommodation Fees </text><text x="94.450" y="684.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">and other amounts properly due, damage beyond fair wear and tear, loss of Hostel property, missing keys or </text><text x="94.450" y="695.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">access devices, and other amounts recoverable under this Agreement. The Security Deposit payable by the </text><text x="94.450" y="706.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Resident shall be LKR {{depositAmount}} ({{depositAmountWords}}) and shall be paid before the Accommodation Start Date unless </text><text x="94.450" y="717.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">otherwise agreed in writing. The conditions governing the Security Deposit are set out in Clause 4.0.</text><text x="57.000" y="733.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.14</text><text x="94.450" y="733.151" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Check-Out Notice”</text><text x="180.100" y="733.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – A Check-Out Notice means written notice given by the Resident to the Proprietor or </text><text x="94.450" y="744.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Proprietor's Representative stating the date upon which the Resident intends to end her accommodation and </text><text x="94.450" y="755.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">leave the Hostel (“Intended Check-Out Date”). The date on which a valid Check-Out Notice is received shall be </text><text x="94.450" y="766.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the “Check-Out Notice Date”. The Resident shall provide not less than one (1) calendar month's written Check-</text><text x="94.450" y="776.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Out Notice.</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="57.000" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.15</text><text x="94.450" y="132.301" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Check-Out Date”</text><text x="171.100" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Check-Out Date shall be the later of: (a) the date falling one (1) calendar month after </text><text x="94.450" y="143.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Check-Out Notice Date; or (b) the Intended Check-Out Date specified by the Resident. Unless otherwise </text><text x="94.450" y="154.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">expressly agreed by the Proprietor in writing, the Check-Out Date shall not occur before expiry of the Minimum </text><text x="94.450" y="165.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Stay Period.</text><text x="57.000" y="180.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.16</text><text x="94.450" y="180.601" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">“Allocated Accommodation”</text><text x="218.450" y="180.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve"> – The Allocated Accommodation means the bed space and/or Hostel Room </text><text x="94.450" y="191.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">initially allocated to the Resident by the Proprietor for accommodation purposes. Such allocation is made for </text><text x="94.450" y="202.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the administration and operation of the Hostel and does not grant the Resident any estate, tenancy, leasehold </text><text x="94.450" y="213.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">interest, proprietary right or exclusive legal possession over any particular room or part of the Hostel.</text><text x="57.000" y="228.901" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">2.0</text><text x="94.450" y="228.901" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">General</text><text x="57.000" y="244.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.1</text><text x="94.450" y="244.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">This Hostel Accommodation Agreement constitutes the entire agreement between the Proprietor and the </text><text x="94.450" y="255.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Resident in relation to the provision of managed hostel accommodation. The Resident is granted a personal, </text><text x="94.450" y="266.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">limited and non-transferable contractual right to reside in and use the Allocated Accommodation during the </text><text x="94.450" y="277.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation Period, subject to this Agreement and the Hostel Rules. The Parties expressly agree that this </text><text x="94.450" y="288.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Agreement is an agreement for the provision of managed hostel accommodation and related facilities and is not </text><text x="94.450" y="299.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">intended to create a tenancy, lease, leasehold estate, easement, or other proprietary interest in favour of the </text><text x="94.450" y="310.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Resident. The Proprietor shall retain possession, management, supervision and control of the Hostel at all </text><text x="94.450" y="321.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">times.</text><text x="57.000" y="336.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.2</text><text x="94.450" y="336.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Any descriptions or illustrations of the Hostel issued by the Proprietor, and any descriptions or illustrations </text><text x="94.450" y="347.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">contained in the catalogues or brochures, are issued or published for the sole purpose of giving an approximate </text><text x="94.450" y="358.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">idea of the nature of the Hostel and shall not form part of this Hostel Accommodation Agreement nor have any </text><text x="94.450" y="369.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">contractual force.</text><text x="57.000" y="384.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.3</text><text x="94.450" y="384.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The terms and conditions contained in this Agreement shall govern the provision and use of accommodation by </text><text x="94.450" y="395.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Resident and shall prevail over any terms sought to be imposed by the Resident unless expressly accepted </text><text x="94.450" y="406.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">by the Proprietor in writing.</text><text x="57.000" y="422.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.4</text><text x="94.450" y="422.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident's right to accommodation under this Agreement is personal to the Resident and shall not be </text><text x="94.450" y="433.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">assigned, transferred, sublet, licensed or otherwise made available to another person. The Resident shall not </text><text x="94.450" y="444.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">permit any other person to occupy or use the Allocated Accommodation except as expressly permitted under </text><text x="94.450" y="454.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Hostel Rules.</text><text x="57.000" y="470.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.5</text><text x="94.450" y="470.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident shall comply with the Hostel Rules contained in Appendix 1 and with reasonable operational and </text><text x="94.450" y="481.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">safety&#160; instructions&#160; given&#160; by&#160; the&#160; Proprietor,&#160; Proprietor's&#160; Representative&#160; or&#160; Hostel&#160; Warden.&#160; A&#160; material&#160; or </text><text x="94.450" y="492.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">repeated breach of the Hostel Rules may constitute grounds for termination of the Resident's accommodation </text><text x="94.450" y="503.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">under Clause 7.0. A serious breach involving safety, violence, theft, illegal conduct, deliberate damage, </text><text x="94.450" y="514.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">unauthorised occupation or conduct creating a material risk to other Residents or the Hostel may result in </text><text x="94.450" y="525.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">immediate termination in accordance with Clause 7.5. Any deductions from the Security Deposit shall be made </text><text x="94.450" y="536.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">only in accordance with Clause 4.0.</text><text x="57.000" y="551.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.6</text><text x="94.450" y="551.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">This Agreement shall continue for the Accommodation Period and shall expire upon the Check-Out Date or </text><text x="94.450" y="562.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">earlier termination in accordance with this Agreement. The Resident shall have no automatic right of renewal or </text><text x="94.450" y="573.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">continued accommodation after expiry. Any extension must be approved by the Proprietor.</text><text x="57.000" y="588.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.7</text><text x="94.450" y="588.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Residents must submit all complaints in the first instance to the Proprietor’s Representative at +94 76 698 </text><text x="94.450" y="599.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2426. If a complaint is not resolved by the Proprietor’s Representative within a reasonable time, the Resident </text><text x="94.450" y="610.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">may escalate the complaint in writing to Proprietor at {{hostelEmail}}. All complaints will be </text><text x="94.450" y="621.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">handled confidentially and in good faith, and no Resident will be disadvantaged or adversely treated for raising </text><text x="94.450" y="632.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">a complaint.</text><text x="57.000" y="648.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.8</text><text x="94.450" y="648.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The allocation of a particular Hostel Room, bed, cupboard or other accommodation space is made as part of </text><text x="94.450" y="659.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Proprietor's management of the Hostel. Where reasonably required for maintenance, repairs, safety, </text><text x="94.450" y="670.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">occupancy management, roommate arrangements, operational requirements or the proper management of the </text><text x="94.450" y="681.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Hostel, the Proprietor may relocate the Resident to another reasonably comparable Hostel Room or bed within </text><text x="94.450" y="691.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Hostel. Where practicable, reasonable prior notice shall be given to the Resident. A reallocation made </text><text x="94.450" y="702.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">under this Clause shall not of itself alter the Monthly Accommodation Fee unless otherwise agreed in writing.</text><text x="57.000" y="718.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.9</text><text x="94.450" y="718.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Proprietor, Proprietor's Representative, Hostel Warden and authorised maintenance or service personnel </text><text x="94.450" y="729.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">may&#160; access&#160; Hostel&#160; Rooms&#160; at&#160; reasonable&#160; times&#160; where&#160; reasonably&#160; necessary&#160; for&#160; inspection,&#160; cleaning, </text><text x="94.450" y="740.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">maintenance, repairs, safety, security, management of shared accommodation, investigation of a reported </text><text x="94.450" y="751.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">breach, or the operation of the Hostel. Where practicable, reasonable notice shall be given before access. No </text><text x="94.450" y="762.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">advance notice shall be required in an emergency, where there is an immediate safety or security concern, or </text><text x="94.450" y="773.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">where urgent action is reasonably required to protect persons or property. The Resident shall not install, </text><text x="94.450" y="784.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">replace or alter locks or prevent authorised management access.</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="57.000" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2.10</text><text x="94.450" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Kitchens,&#160; bathrooms&#160; where&#160; shared,&#160; washing&#160; machines,&#160; refrigerators,&#160; common&#160; areas and other&#160; common </text><text x="94.450" y="143.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">facilities are provided for shared use and remain under the management and control of the Proprietor. Use of </text><text x="94.450" y="154.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">such facilities is subject to availability, the Hostel Rules and reasonable operational requirements. No Resident </text><text x="94.450" y="165.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">shall acquire any exclusive right to any common facility.</text><text x="57.000" y="180.601" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">3.0</text><text x="94.450" y="180.601" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Use and Handover of Allocated Accommodation</text><text x="57.000" y="196.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.1</text><text x="94.450" y="196.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">On or before the Check-Out Date, the Resident shall leave the Allocated Accommodation and return it to the </text><text x="94.450" y="207.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Proprietor, Proprietor's Representative or Hostel Warden in a reasonably clean and orderly condition, having </text><text x="94.450" y="217.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">regard to its condition on the Accommodation Start Date and subject to fair wear and tear.</text><text x="57.000" y="233.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.2</text><text x="94.450" y="233.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident shall not alter, modify, install fixtures in, paint, damage or otherwise make changes to any Hostel </text><text x="94.450" y="244.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Room or Hostel property without the prior written approval of the Proprietor or Proprietor's Representative.</text><text x="57.000" y="259.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.3</text><text x="94.450" y="259.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Where furniture, equipment or other Hostel property is lost or damaged as a result of the act, omission, </text><text x="94.450" y="270.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">negligence or misuse of the Resident or her permitted visitor, the Resident shall be responsible for the </text><text x="94.450" y="281.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">reasonable repair or replacement cost. The Proprietor may also charge an administration fee equal to 10% of </text><text x="94.450" y="292.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the repair or replacement cost where administrative work is reasonably incurred in arranging such repair or </text><text x="94.450" y="303.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">replacement. Fair wear and tear shall not be chargeable to the Resident. In relation to shared property or </text><text x="94.450" y="314.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">common facilities, the Resident shall be responsible only to the extent that responsibility for the loss or damage </text><text x="94.450" y="325.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">is reasonably attributable to the Resident or persons for whom the Resident is responsible. The amount </text><text x="94.450" y="336.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">properly due may be deducted from the Security Deposit in accordance with Clause 4.0.</text><text x="57.000" y="351.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">3.4</text><text x="94.450" y="351.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The&#160; Resident&#160; shall&#160; promptly&#160; notify&#160; the&#160; Hostel&#160; Warden&#160; of&#160; any&#160; material&#160; defect,&#160; damage,&#160; safety&#160; issue&#160; or </text><text x="94.450" y="362.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">maintenance requirement affecting the Allocated Accommodation or common facilities.</text><text x="57.000" y="378.301" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">4.0</text><text x="94.450" y="378.301" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Security Deposit</text><text x="57.000" y="393.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">4.1</text><text x="94.450" y="393.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Subject to the terms of this Agreement, the Security Deposit shall be refundable after the Resident has </text><text x="94.450" y="404.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">completed check-out or after any cancellation, no-show or termination has been finalised, and after all amounts </text><text x="94.450" y="415.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">properly due under this Agreement have been determined.</text><text x="57.000" y="431.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">4.2</text><text x="94.450" y="431.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Following check-out, cancellation, no-show or termination, the Proprietor may deduct from the Security Deposit:</text><text x="94.450" y="446.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">a.</text><text x="120.350" y="446.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">unpaid Accommodation Fees;</text><text x="94.450" y="460.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">b.</text><text x="120.350" y="460.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">unpaid charges properly due under this Agreement;</text><text x="94.450" y="474.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">c.</text><text x="120.350" y="474.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">reasonable repair or replacement costs for damage or loss for which the Resident is responsible;</text><text x="94.450" y="488.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">d.</text><text x="120.350" y="488.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">replacement costs for missing keys, smart cards or other access devices;</text><text x="94.450" y="502.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">e.</text><text x="120.350" y="502.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">reasonable additional cleaning costs where the accommodation is left in a condition materially worse </text><text x="120.350" y="513.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">than ordinary use would reasonably cause;</text><text x="94.450" y="527.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">f.</text><text x="120.350" y="527.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">any other amount properly recoverable from the Resident under this Agreement; and</text><text x="94.450" y="541.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">g.</text><text x="120.350" y="541.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">any cancellation or no-show charge payable under Clause 5.5.</text><text x="94.450" y="555.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Proprietor shall provide the Resident with a written summary of material deductions. The balance of the </text><text x="94.450" y="566.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Security Deposit shall be returned within fourteen (14) working days after the check-out, cancellation, no-show </text><text x="94.450" y="577.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">or termination has been finalised. Where the amount due exceeds the Security Deposit, the Resident shall pay </text><text x="94.450" y="588.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the balance within seven (7) days of written demand.</text><text x="57.000" y="603.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">4.3</text><text x="94.450" y="603.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident shall not be entitled to commence accommodation until the required Security Deposit has been </text><text x="94.450" y="614.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">paid in full unless otherwise agreed by the Proprietor in writing. Where the Resident fails to pay the Security </text><text x="94.450" y="625.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Deposit&#160; by&#160; the&#160; agreed&#160; date,&#160; the&#160; Proprietor&#160; may&#160; cancel&#160; the&#160; Resident's&#160; accommodation&#160; before&#160; the </text><text x="94.450" y="636.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation Start Date. Any amount held specifically as a Security Deposit shall remain subject to the </text><text x="94.450" y="647.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">refund and deduction provisions of this Clause.</text><text x="57.000" y="662.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">4.4</text><text x="94.450" y="662.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Security Deposit shall not be treated by the Resident as payment of the final month's Accommodation Fee </text><text x="94.450" y="673.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">or any other monthly Accommodation Fee.</text><text x="57.000" y="689.101" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">5.0</text><text x="94.450" y="689.101" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Accommodation Period and Minimum Stay</text><text x="57.000" y="704.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">5.1</text><text x="94.450" y="704.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident agrees to a Minimum Stay Period of Six (6) months commencing on the Accommodation Start </text><text x="94.450" y="715.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Date. Unless otherwise agreed in writing by the Proprietor, the Check-Out Date shall not occur before expiry of </text><text x="94.450" y="726.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Minimum Stay Period.</text><text x="57.000" y="741.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">5.2</text><text x="94.450" y="741.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">If the Resident voluntarily leaves or ceases using the Hostel before the Check-Out Date, such departure shall </text><text x="94.450" y="752.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">not by itself&#160; terminate&#160; this&#160; Agreement,&#160; shorten&#160; the&#160; Minimum Stay Period&#160; or&#160; release&#160; the Resident&#160; from </text><text x="94.450" y="763.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation Fees and other contractual amounts payable through the Check-Out Date. Any earlier release </text><text x="94.450" y="774.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">from the Minimum Stay Period must be expressly agreed by the Proprietor in writing or arise from termination </text><text x="94.450" y="785.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">otherwise permitted under this Agreement or applicable law.</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">4</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="57.000" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">5.3</text><text x="94.450" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Any Accommodation Fees or other amounts properly due as a result of the Resident's failure to comply with the </text><text x="94.450" y="143.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Minimum Stay Period may be deducted from the Security Deposit, subject to Clause 4.0.</text><text x="57.000" y="158.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">5.4</text><text x="94.450" y="158.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Any&#160; continued&#160; accommodation&#160; following&#160; the&#160; Minimum&#160; Stay&#160; Period&#160; shall&#160; remain&#160; subject&#160; to&#160; this&#160; Hostel </text><text x="94.450" y="169.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation Agreement and shall not create a tenancy or proprietary interest. The Monthly Accommodation </text><text x="94.450" y="180.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Fee applicable to any extension may be agreed between the Parties in writing.</text><text x="57.000" y="196.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">5.5</text><text x="94.450" y="196.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Once the Resident has accepted this Agreement and paid the Security Deposit, accommodation shall be </text><text x="94.450" y="207.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">reserved for the Resident from the Accommodation Start Date. If the Resident:</text><text x="94.450" y="222.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">a.</text><text x="120.350" y="222.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">cancels the accommodation less than thirty (30) calendar days before the Accommodation Start Date; or</text><text x="94.450" y="236.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">b.</text><text x="120.350" y="236.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">fails to commence accommodation on the Accommodation Start Date without the prior written approval </text><text x="120.350" y="247.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">of the Proprietor,</text><text x="94.450" y="261.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Proprietor may deduct from the Security Deposit a cancellation or no-show charge equal to one (1) month's </text><text x="94.450" y="272.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Monthly Accommodation Fee.</text><text x="94.450" y="287.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">If the Security Deposit is more than the amount properly deductible, the balance shall be refunded to the </text><text x="94.450" y="298.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Resident.</text><text x="94.450" y="314.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">If the Resident does not attend the Hostel and does not contact the Proprietor within seven (7) calendar days </text><text x="94.450" y="325.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">after the Accommodation Start Date, the Proprietor may cancel the accommodation and make it available to </text><text x="94.450" y="336.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">another Resident.</text><text x="94.450" y="351.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">If the Resident cancels thirty (30) or more calendar days before the Accommodation Start Date, the Security </text><text x="94.450" y="362.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Deposit shall be refunded, subject to any other amounts properly due under this Agreement.</text><text x="57.000" y="377.851" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">6.0</text><text x="94.450" y="377.851" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Accommodation Fees</text><text x="57.000" y="393.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">6.1</text><text x="94.450" y="393.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident shall pay the Monthly Accommodation Fee to the Proprietor on a monthly basis on or before the </text><text x="94.450" y="404.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">last day of&#160; each&#160; calendar month.&#160; Accommodation Fees shall&#160; remain&#160; contractually payable&#160; through and </text><text x="94.450" y="415.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">including the Check-Out Date notwithstanding that the Resident may physically leave or cease using the Hostel </text><text x="94.450" y="426.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">before that date, subject to the other provisions of this Agreement.</text><text x="57.000" y="441.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">6.2</text><text x="94.450" y="441.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Should the Accommodation Start Date fall after the first day of the month, the amount payable on the last day </text><text x="94.450" y="452.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">of the month shall be calculated as a proportional amount of the Monthly Accommodation Fee. For example, if </text><text x="94.450" y="463.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Accommodation Start Date is 3 January 2023, the Monthly Accommodation Fee payable by 31 January </text><text x="94.450" y="474.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">2023 shall be adjusted as follows: If the Check-Out Date falls before the last day of a calendar month, the </text><text x="94.450" y="485.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation Fee for that final month shall be calculated on a pro-rata daily basis using the number of </text><text x="94.450" y="496.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">calendar days in that month.</text><text x="94.450" y="511.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Amount Payable at the end of the month (31 January 2023) = (Monthly Accommodation Fee / 31) x 29.</text><text x="57.000" y="525.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">6.3</text><text x="94.450" y="525.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Accommodation Fee excludes any applicable statutory taxes, including Value Added Tax, where legally </text><text x="94.450" y="536.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">applicable.</text><text x="57.000" y="552.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">6.4</text><text x="94.450" y="552.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">All payments relating to the Security Deposit, Accommodation Fees and other amounts payable under this </text><text x="94.450" y="563.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Agreement shall be made only by bank transfer to the following account:</text><text x="108.850" y="578.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Account Name: Perk Haven</text><text x="108.850" y="592.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Account No.: 335100140023553</text><text x="108.850" y="606.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Bank: People’s Bank</text><text x="108.850" y="620.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Branch: Nugegoda City</text><text x="57.000" y="634.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">6.5</text><text x="94.450" y="634.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident shall send the payment slip to the Proprietor, the Proprietor’s Representative, or through the </text><text x="94.450" y="645.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Hostel Warden for verification. Cash payments or payments to any other account shall not be accepted, and </text><text x="94.450" y="656.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Perk Haven and/or the Proprietor shall not be responsible for any such payments.</text><text x="57.000" y="671.701" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">7.0</text><text x="94.450" y="671.701" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Termination and End of Accommodation</text><text x="57.000" y="687.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.1</text><text x="94.450" y="687.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The&#160; Resident&#160; may&#160; end&#160; her&#160; accommodation&#160; by&#160; providing&#160; a&#160; valid&#160; Check-Out&#160; Notice&#160; to </text><text x="94.450" y="698.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">{{hostelEmail}} in accordance with Clause 1.14. The Check-Out Date shall be determined in </text><text x="94.450" y="709.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">accordance with Clause 1.15. The Resident's obligations relating to Accommodation Fees, return of Hostel </text><text x="94.450" y="720.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">property, damage, handover and outstanding charges shall continue through the Check-Out Date.</text><text x="57.000" y="735.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.2</text><text x="94.450" y="735.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Before completing check-out, the Resident shall settle all outstanding Accommodation Fees and other amounts </text><text x="94.450" y="746.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">payable under this Agreement. The Resident shall not unilaterally treat the Security Deposit as payment of </text><text x="94.450" y="757.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation Fees.</text><text x="57.000" y="772.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.3</text><text x="94.450" y="772.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Proprietor may make deductions from the Security Deposit only in accordance with Clause 4.0.</text><text x="57.000" y="788.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.4</text><text x="94.450" y="788.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Upon check-out or termination, the Resident shall return all room keys, cupboard keys, smart cards, access </text><text x="94.450" y="799.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">cards and other Hostel property issued to the Resident.</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">5</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="57.000" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.5</text><text x="94.450" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Proprietor may terminate the Resident's accommodation where the Resident:</text><text x="94.450" y="147.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">a.</text><text x="120.350" y="147.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">fails to pay an Accommodation Fee or other material amount due under this Agreement;</text><text x="94.450" y="161.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">b.</text><text x="120.350" y="161.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">commits a material or repeated breach of the Hostel Rules;</text><text x="94.450" y="175.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">c.</text><text x="120.350" y="175.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">causes serious or deliberate damage to Hostel property;</text><text x="94.450" y="189.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">d.</text><text x="120.350" y="189.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">permits an unauthorised person to reside in or use the Allocated Accommodation;</text><text x="94.450" y="203.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">e.</text><text x="120.350" y="203.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">engages in theft, violence, harassment, illegal activity or conduct creating a material safety or security </text><text x="120.350" y="214.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">risk;</text><text x="94.450" y="228.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">f.</text><text x="120.350" y="228.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">provides materially false information in connection with admission to the Hostel; or</text><text x="94.450" y="242.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">g.</text><text x="120.350" y="242.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">otherwise commits a material breach of this Agreement.</text><text x="94.450" y="256.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Where a breach is reasonably capable of remedy and does not involve an immediate safety or security </text><text x="94.450" y="267.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">concern,&#160; the&#160; Proprietor&#160; shall&#160; provide&#160; the&#160; Resident&#160; with&#160; written&#160; notice&#160; of&#160; the&#160; breach&#160; and&#160; a&#160; reasonable </text><text x="94.450" y="278.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">opportunity to remedy it. Where the conduct involves an</text><text x="94.450" y="293.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">immediate safety or security risk, violence, theft, serious illegal activity or another serious breach requiring </text><text x="94.450" y="304.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">urgent action, the Proprietor may terminate the Resident's accommodation with immediate effect, subject </text><text x="94.450" y="315.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">always to applicable law.</text><text x="57.000" y="331.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.6</text><text x="94.450" y="331.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Upon expiry or termination of this Agreement, the Resident's contractual right to use the Hostel and Allocated </text><text x="94.450" y="342.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation shall cease and the Resident shall leave the Hostel and return all Hostel property. If the </text><text x="94.450" y="352.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Resident does not leave when required, the Proprietor may take such lawful steps as are available to recover </text><text x="94.450" y="363.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">possession and recover amounts properly due. Nothing in this Agreement authorises the use of unlawful force </text><text x="94.450" y="374.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">or any action contrary to applicable law.</text><text x="57.000" y="390.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7.7</text><text x="94.450" y="390.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Termination or expiry shall not affect any right or obligation which accrued before termination or which by its </text><text x="94.450" y="401.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">nature is intended to continue, including obligations relating to unpaid Accommodation Fees, damage, loss and </text><text x="94.450" y="412.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">return of Hostel property.</text><text x="57.000" y="427.651" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">8.0</text><text x="94.450" y="427.651" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Governing Law, Notices and General Provisions</text><text x="57.000" y="443.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">8.1</text><text x="94.450" y="443.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">This Agreement shall be governed by and interpreted in accordance with the laws of Sri Lanka. Any dispute </text><text x="94.450" y="454.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">arising from or relating to this Agreement shall be subject to the jurisdiction of the courts of competent </text><text x="94.450" y="465.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">jurisdiction in Sri Lanka.</text><text x="57.000" y="480.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">8.2</text><text x="94.450" y="480.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Any notice required under this Agreement shall be given in writing. A notice to the Proprietor may be delivered:</text><text x="94.450" y="495.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">a.</text><text x="120.350" y="495.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">personally to the Proprietor or Proprietor's Representative;</text><text x="94.450" y="509.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">b.</text><text x="120.350" y="509.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">by email to the designated Hostel email address; or</text><text x="94.450" y="523.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">c.</text><text x="120.350" y="523.801" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">by another written electronic method expressly designated by the Proprietor for official notices.</text><text x="57.000" y="537.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">8.3</text><text x="94.450" y="537.751" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">A notice to the Resident may be delivered personally or sent to the email address or contact number provided </text><text x="94.450" y="548.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">by the Resident in her Hostel registration details. The sender shall retain reasonable evidence of delivery.</text><text x="57.000" y="564.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">8.4</text><text x="94.450" y="564.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">No&#160; material&#160; amendment&#160; to&#160; the&#160; Accommodation&#160; Fee,&#160; Security&#160; Deposit,&#160; Minimum&#160; Stay&#160; Period&#160; or&#160; other </text><text x="94.450" y="575.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">fundamental commercial terms of this Agreement shall be effective unless agreed in writing between the </text><text x="94.450" y="586.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Parties. The Proprietor may make reasonable amendments to the Hostel Rules from time to time where </text><text x="94.450" y="597.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">reasonably required for safety, security, hygiene, operation or proper management of the Hostel, provided that </text><text x="94.450" y="607.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">such amendments are communicated to Residents and do not materially alter the fundamental commercial </text><text x="94.450" y="618.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">terms of this Agreement.</text><text x="57.000" y="634.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">8.5</text><text x="94.450" y="634.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">If&#160; any&#160; provision&#160; of&#160; this&#160; Agreement&#160; is&#160; determined&#160; by&#160; a&#160; court&#160; of&#160; competent&#160; jurisdiction&#160; to&#160; be&#160; invalid&#160; or </text><text x="94.450" y="645.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">unenforceable, that provision shall be severed or enforced to the maximum extent permitted by law, and the </text><text x="94.450" y="656.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">remaining provisions shall continue in effect.</text><text x="57.000" y="671.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">8.6</text><text x="94.450" y="671.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">A failure or delay by either Party in enforcing any provision of this Agreement shall not constitute a waiver of </text><text x="94.450" y="682.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">that provision or of the right to enforce it subsequently.</text><text x="57.000" y="698.101" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">9.0</text><text x="94.450" y="698.101" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Appendices</text><text x="57.000" y="713.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9.1</text><text x="94.450" y="713.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Appendix 1 - Hostel Rules</text><text x="57.000" y="729.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9.2</text><text x="94.450" y="729.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Appendix 2 - Inventory of Items and Facilities Provided to the Resident</text><text x="57.000" y="744.451" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">I, {{studentName}} (NIC {{studentId}}), acknowledge that I have read and understood this Hostel Accommodation Agreement, </text><text x="57.000" y="755.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">including Appendix 1 – Hostel Rules, and agree to comply with its terms. Appendix 2 – Inventory of Items and Facilities </text><text x="57.000" y="766.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Provided to the Resident shall be completed and acknowledged at check-in.</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">6</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="57.000" y="132.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">I acknowledge that accommodation at The Perk Haven is provided as managed hostel accommodation and that my </text><text x="57.000" y="143.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">allocation to a Hostel Room or bed space does not grant me any tenancy, leasehold estate or proprietary interest in the </text><text x="57.000" y="154.201" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Hostel or any part thereof.</text><text x="57.000" y="170.151" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">I further acknowledge that I am required to provide at least one (1) calendar month's written Check-Out Notice, subject to </text><text x="57.000" y="181.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Minimum Stay Period, and that Accommodation Fees remain payable through the applicable Check-Out Date in </text><text x="57.000" y="192.051" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">accordance with this Agreement.</text><text x="57.000" y="208.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">IN WITNESS WHEREOF, the Parties have executed this Hostel Accommodation Agreement, which shall take effect </text><text x="57.000" y="218.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">from the Accommodation Start Date defined in Clause 1.9.</text><text x="62.350" y="248.801" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Signature of the Proprietor's Representative</text><text x="62.350" y="280.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">_______________________________</text><text x="62.350" y="302.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Mahesh Tishantha (NIC 792272428V)</text><text x="62.350" y="314.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">on behalf of Mrs. Warnakulasooriya Nadeesha Joanne </text><text x="62.350" y="326.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Kumari Fernando</text><text x="62.350" y="338.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Date: {{agreementDate}}</text><text x="303.150" y="248.801" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Signature of the Resident</text><text x="303.150" y="280.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">_______________________________</text><text x="303.150" y="302.601" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">{{residentSignatureName}}</text><text x="303.150" y="314.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">NIC: {{studentId}}</text><text x="303.150" y="326.401" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Date: {{residentSignatureDate}}</text></svg></div><div class="page"><svg xmlns="http://www.w3.org/2000/svg" width="595.304pt" height="841.890pt" viewBox="0 0 595.304 841.890"><image href="{{headerDataUri}}" x="71.6" y="8.6" width="452.2" height="114.3" preserveAspectRatio="none"/><text x="62.350" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Telephone: {{hostelTelephone}}</text><text x="278.150" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">7</text><text x="283.150" y="815.501" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve"> of Page </text><text x="312.300" y="815.501" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">9</text><text x="417.450" y="814.801" font-size="5.250pt" font-weight="700" font-style="normal" xml:space="preserve">Email: {{hostelEmail}}</text><text x="226.850" y="134.651" font-size="8.625pt" font-weight="700" font-style="normal" xml:space="preserve">Appendix 1 - Hostel Rules</text><text x="57.000" y="155.501" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">1.0</text><text x="94.450" y="155.501" font-size="6.750pt" font-weight="700" font-style="normal" xml:space="preserve">Behavior</text><text x="57.000" y="170.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.1</text><text x="94.450" y="170.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Accommodation at the Hostel is provided only to female students and staff of NSBM, the University of </text><text x="94.450" y="181.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Colombo, the University of Sri Jayewardenepura and such other educational institutions or categories of </text><text x="94.450" y="192.851" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Resident as may be accepted by the Proprietor.</text><text x="57.000" y="208.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.2</text><text x="94.450" y="208.301" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident shall not let any outsider visit the Hostel or Hostel Room without obtaining prior consent from the </text><text x="94.450" y="219.251" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Hostel Warden.</text><text x="57.000" y="234.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.3</text><text x="94.450" y="234.701" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Residents are expected to behave in an acceptable manner anywhere within the Hostel and Hostel </text><text x="94.450" y="245.651" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Rooms.</text><text x="57.000" y="261.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.4</text><text x="94.450" y="261.101" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The noise level, and the volume of music must be always kept low.</text><text x="57.000" y="276.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.5</text><text x="94.450" y="276.551" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">Pranks and ragging in any form are strictly prohibited.</text><text x="57.000" y="292.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.6</text><text x="94.450" y="292.001" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident must return to the Hostel by 8:00 pm, daily for their safety. Residents who need to stay outside </text><text x="94.450" y="302.951" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">the Hostel premises after 8:00 pm, must inform the Hostel Warden and / or the Proprietor. This communication </text><text x="94.450" y="313.901" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">shall be received from a parent/guardian of the Resident to the Hostel Warden.</text><text x="57.000" y="329.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">1.7</text><text x="94.450" y="329.351" font-size="6.750pt" font-weight="400" font-style="normal" xml:space="preserve">The Resident must not leave the Hostel premises
