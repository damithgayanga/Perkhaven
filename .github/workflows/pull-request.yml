name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and package backend
        run: ./gradlew clean test bootJar --no-daemon
      - name: Build production container
        run: docker build --tag perkhaven-backend:pr .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure
      - name: Validate bootstrap
        working-directory: infrastructure/bootstrap
        run: terraform init -backend=false && terraform validate
      - name: Validate production
        working-directory: infrastructure/environments/production
        run: terraform init -backend=false && terraform validate

  terraform-plan:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      TF_STATE_BUCKET: perkhaven-terraform-state-890839646565
      AWS_PLAN_ROLE_ARN: arn:aws:iam::890839646565:role/perkhaven-github-plan
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_backend_image_uri: 890839646565.dkr.ecr.ap-south-1.amazonaws.com/perkhaven-backend:plan-only
      TF_VAR_enable_custom_domain: "false"
      TF_VAR_enable_ses_domain: "false"
      TF_VAR_create_route53_zone: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize remote state
        working-directory: infrastructure/environments/production
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
      - name: Create production plan
        working-directory: infrastructure/environments/production
        run: terraform plan -lock-timeout=5m -no-color
