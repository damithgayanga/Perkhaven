name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: Deploy backend, frontend, and infrastructure even when no files changed
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: perkhaven-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "890839646565"
  TF_STATE_BUCKET: perkhaven-terraform-state-890839646565
  AWS_TERRAFORM_ROLE_ARN: arn:aws:iam::890839646565:role/perkhaven-github-terraform
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::890839646565:role/perkhaven-github-deploy
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_domain_name: "perkhaven.lk"
  TF_VAR_enable_custom_domain: "true"
  TF_VAR_enable_ses_domain: "false"
  TF_VAR_create_route53_zone: "false"
  TF_VAR_database_backup_retention_days: ${{ vars.RDS_BACKUP_RETENTION_DAYS || '1' }}
  TF_VAR_initial_admin_email: ${{ vars.INITIAL_ADMIN_EMAIL || 'admin@perkhaven.com' }}
  TF_VAR_initial_admin_username: ${{ vars.INITIAL_ADMIN_USERNAME || 'admin' }}
  TF_VAR_hostel_contact_email: ${{ vars.HOSTEL_CONTACT_EMAIL || 'hello@perkhaven.example' }}
  TF_VAR_hostel_contact_telephone: ${{ vars.HOSTEL_CONTACT_TELEPHONE || '+94 11 234 5678' }}
  TF_LOCK_STALE_AFTER_MINUTES: ${{ vars.TF_LOCK_STALE_AFTER_MINUTES || '30' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: filter
        shell: bash
        env:
          FORCE_DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy_all }}
        run: |
          if [[ "$FORCE_DEPLOY_ALL" == "true" ]]; then
            echo "Manual force deployment requested; enabling every deployment component."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "infrastructure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD^"
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          echo "$changed"
          if grep -q '^front/' <<< "$changed"; then echo 'frontend=true' >> "$GITHUB_OUTPUT"; else echo 'frontend=false' >> "$GITHUB_OUTPUT"; fi
          if grep -q '^backend/' <<< "$changed" || grep -q '^Dockerfile$' <<< "$changed"; then echo 'backend=true' >> "$GITHUB_OUTPUT"; else echo 'backend=false' >> "$GITHUB_OUTPUT"; fi
          if grep -q '^infrastructure/' <<< "$changed" || grep -q '^\.github/workflows/' <<< "$changed"; then echo 'infrastructure=true' >> "$GITHUB_OUTPUT"; else echo 'infrastructure=false' >> "$GITHUB_OUTPUT"; fi

  aws-ready:
    needs: changes
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ready: ${{ steps.status.outputs.ready }}
    steps:
      - name: Report OIDC trust claims
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          export PERKHAVEN_OIDC_TOKEN
          PERKHAVEN_OIDC_TOKEN=$(jq -r '.value' <<< "$response")
          python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["PERKHAVEN_OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          visible = {key: claims.get(key) for key in ("sub", "aud", "repository", "ref", "environment")}
          print("GitHub OIDC claims:", json.dumps(visible, sort_keys=True))
          PY
      - name: Check whether AWS bootstrap is complete
        id: credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2
      - name: Record bootstrap status
        id: status
        shell: bash
        run: echo "ready=${{ steps.credentials.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

  test:
    name: Test application
    needs: [aws-ready, changes]
    if: ${{ needs.aws-ready.outputs.ready == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend tests
        if: ${{ needs.changes.outputs.backend == 'true' }}
        working-directory: backend
        run: ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build frontend
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: front
        run: npm ci && npx next build --webpack

  app-build:
    name: Build application image
    needs: [aws-ready, changes, test]
    if: ${{ needs.aws-ready.outputs.ready == 'true' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve immutable image URI
        id: image
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA}"
          image_uri="${{ steps.ecr.outputs.registry }}/perkhaven-backend:${image_tag}"
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name perkhaven-backend --image-ids imageTag="${image_tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.image.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.exists != 'true'
      - name: Build and push backend image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-deploy:
    name: IaC, migrations and backend deployment
    needs: [aws-ready, changes, test, app-build]
    if: ${{ always() && needs.aws-ready.outputs.ready == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infrastructure == 'true') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.app-build.result == 'success' || needs.app-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Configure Terraform credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve registered Route 53 hosted zone
        id: dns
        shell: bash
        run: |
          zones=$(aws route53 list-hosted-zones-by-name \
            --dns-name "$TF_VAR_domain_name" \
            --max-items 2 \
            --output json)
          zone_id=$(jq -r \
            --arg name "${TF_VAR_domain_name}." \
            '.HostedZones | map(select(.Name == $name and .Config.PrivateZone == false)) | first | .Id // empty' \
            <<< "$zones")
          zone_id="${zone_id#/hostedzone/}"
          if [[ -z "$zone_id" ]]; then
            echo "No public Route 53 hosted zone found for ${TF_VAR_domain_name}." >&2
            exit 1
          fi
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

      - name: Initialize Terraform
        working-directory: infrastructure/environments/production
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Resolve backend image for Terraform
        id: backend-image
        working-directory: infrastructure/environments/production
        env:
          BUILT_IMAGE_URI: ${{ needs.app-build.outputs.image_uri }}
        shell: bash
        run: |
          image_uri="$BUILT_IMAGE_URI"
          if [[ -z "$image_uri" ]]; then
            task_definition=$(terraform output -raw ecs_task_definition_arn)
            image_uri=$(aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query 'taskDefinition.containerDefinitions[?name==`backend`].image | [0]' \
              --output text)
          fi
          if [[ -z "$image_uri" || "$image_uri" == "None" ]]; then
            echo "Unable to resolve the backend image for Terraform." >&2
            exit 1
          fi
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Recover stale Terraform state lock
        working-directory: infrastructure/environments/production
        shell: bash
        run: |
          lock_key="perkhaven/production/terraform.tfstate.tflock"
          lock_file="${RUNNER_TEMP}/perkhaven-terraform-lock.json"
          if ! aws s3api get-object --bucket "$TF_STATE_BUCKET" --key "$lock_key" "$lock_file" >/dev/null 2>&1; then
            echo "No Terraform lock object found."
            exit 0
          fi

          lock_id=$(jq -r '.ID // empty' "$lock_file")
          created=$(jq -r '.Created // empty' "$lock_file")
          if [[ -z "$lock_id" || -z "$created" ]]; then
            echo "Terraform lock object is missing lock metadata; leaving it untouched." >&2
            exit 1
          fi

          created_epoch=$(date -d "$created" +%s)
          now_epoch=$(date +%s)
          age_minutes=$(( (now_epoch - created_epoch) / 60 ))
          echo "Terraform lock $lock_id is ${age_minutes} minute(s) old."
          if (( age_minutes < TF_LOCK_STALE_AFTER_MINUTES )); then
            echo "Lock is still within the ${TF_LOCK_STALE_AFTER_MINUTES}-minute safety window; refusing to unlock it."
            exit 1
          fi

          echo "Unlocking stale Terraform lock $lock_id."
          terraform force-unlock -force "$lock_id"

      - name: Plan infrastructure
        working-directory: infrastructure/environments/production
        env:
          TF_VAR_backend_image_uri: ${{ steps.backend-image.outputs.uri }}
          TF_VAR_route53_zone_id: ${{ steps.dns.outputs.zone_id }}
        run: terraform plan -lock-timeout=10m -out=production.tfplan

      - name: Apply infrastructure
        working-directory: infrastructure/environments/production
        run: terraform apply -lock-timeout=10m -auto-approve production.tfplan

      - name: Read deployment outputs
        id: infra
        working-directory: infrastructure/environments/production
        shell: bash
        run: |
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "task_definition=$(terraform output -raw ecs_task_definition_arn)" >> "$GITHUB_OUTPUT"
          echo "security_group=$(terraform output -raw ecs_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "subnets=$(terraform output -json ecs_subnet_ids | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "application_url=$(terraform output -raw application_url)" >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(terraform output -raw cognito_hosted_ui_domain)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
          echo "database_identifier=$(terraform output -raw database_identifier)" >> "$GITHUB_OUTPUT"

      - name: Preserve pre-cleanup database snapshot
        env:
          DATABASE_IDENTIFIER: ${{ steps.infra.outputs.database_identifier }}
        shell: bash
        run: |
          snapshot_identifier="${DATABASE_IDENTIFIER}-pre-initial-cleanup"
          if ! aws rds describe-db-snapshots --db-snapshot-identifier "$snapshot_identifier" >/dev/null 2>&1; then
            aws rds create-db-snapshot \
              --db-instance-identifier "$DATABASE_IDENTIFIER" \
              --db-snapshot-identifier "$snapshot_identifier" >/dev/null
            aws rds wait db-snapshot-completed --db-snapshot-identifier "$snapshot_identifier"
          fi

      - name: Configure application deployment credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Flyway migrations in Fargate
        id: migration
        shell: bash
        env:
          CLUSTER: ${{ steps.infra.outputs.cluster }}
          TASK_DEFINITION: ${{ steps.infra.outputs.task_definition }}
          SECURITY_GROUP: ${{ steps.infra.outputs.security_group }}
          SUBNETS: ${{ steps.infra.outputs.subnets }}
        run: |
          network_configuration=$(jq -cn \
            --argjson subnets "$SUBNETS" \
            --arg security_group "$SECURITY_GROUP" \
            '{awsvpcConfiguration:{subnets:$subnets,securityGroups:[$security_group],assignPublicIp:"ENABLED"}}')
          overrides='{"containerOverrides":[{"name":"backend","command":["--spring.main.web-application-type=none","--spring.main.banner-mode=off","--perkhaven.migration-only=true","--perkhaven.scheduling.enabled=false","--perkhaven.storage.provider=local"]}]}'
          run_task_response=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION" \
            --network-configuration "$network_configuration" \
            --overrides "$overrides")
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<< "$run_task_response")
          if [[ -z "$task_arn" ]]; then
            echo "ECS did not start the migration task."
            jq '.failures' <<< "$run_task_response"
            exit 1
          fi

          migration_finished=false
          cleanup_migration_task() {
            if [[ "$migration_finished" != "true" ]]; then
              aws ecs stop-task --cluster "$CLUSTER" --task "$task_arn" \
                --reason "Migration workflow ended before task completion" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_migration_task EXIT

          if ! timeout 15m aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"; then
            echo "Migration task did not stop within 15 minutes."
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
              --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,reason:reason,exitCode:exitCode,logStreamName:logStreamName}}'
            log_stream=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
              --query 'tasks[0].containers[?name==`backend`].logStreamName | [0]' --output text)
            log_group=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" \
              --query 'taskDefinition.containerDefinitions[?name==`backend`].logConfiguration.options."awslogs-group" | [0]' --output text)
            if [[ "$log_stream" != "None" && "$log_group" != "None" ]]; then
              aws logs get-log-events --log-group-name "$log_group" --log-stream-name "$log_stream" \
                --limit 100 --query 'events[*].message' --output text || true
            fi
            exit 1
          fi
          migration_finished=true
          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[?name==`backend`].exitCode | [0]' --output text)
          reason=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --query 'tasks[0].stoppedReason' --output text)
          echo "Migration task stopped: ${reason}; exit code: ${exit_code}"
          test "$exit_code" = "0"

      - name: Deploy backend service
        env:
          CLUSTER: ${{ steps.infra.outputs.cluster }}
          SERVICE: ${{ steps.infra.outputs.service }}
          TASK_DEFINITION: ${{ steps.infra.outputs.task_definition }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --desired-count 1 \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

  frontend-deploy:
    name: Frontend deployment
    needs: [aws-ready, changes, backend-deploy]
    if: ${{ always() && needs.aws-ready.outputs.ready == 'true' && needs.changes.outputs.frontend == 'true' && (needs.backend-deploy.result == 'success' || needs.backend-deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - name: Read deployed infrastructure outputs
        id: infra
        working-directory: infrastructure/environments/production
        shell: bash
        run: |
          terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
          echo "application_url=$(terraform output -raw application_url)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Build static frontend
        working-directory: front
        env:
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.infra.outputs.cognito_client_id }}
          NEXT_PUBLIC_AWS_REGION: ${{ env.AWS_REGION }}
        run: npm ci && npx next build --webpack
      - name: Publish frontend
        env:
          BUCKET: ${{ steps.infra.outputs.frontend_bucket }}
        run: |
          aws s3 sync front/out "s3://${BUCKET}" --delete --exclude '_next/static/*' --cache-control 'no-cache, no-store, must-revalidate'
          aws s3 sync front/out/_next/static "s3://${BUCKET}/_next/static" --cache-control 'public, max-age=31536000, immutable'
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.infra.outputs.distribution }}" --paths '/*'
      - name: Verify production
        env:
          APPLICATION_URL: ${{ steps.infra.outputs.application_url }}
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "${APPLICATION_URL}/"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "${APPLICATION_URL}/actuator/health"
