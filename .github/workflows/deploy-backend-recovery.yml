name: Backend deployment recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-backend-recovery.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_STATE_BUCKET: perkhaven-terraform-state-890839646565
  AWS_TERRAFORM_ROLE_ARN: arn:aws:iam::890839646565:role/perkhaven-github-terraform
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::890839646565:role/perkhaven-github-deploy
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  EXPECTED_BACKEND_IMAGE_SHA: "fc52ba37ae0282efe71d49a61728ea8c95e2ea7d"

jobs:
  deploy-backend:
    name: Apply invoice renumbering and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Configure Terraform credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read production deployment outputs
        id: infra
        working-directory: infrastructure/environments/production
        shell: bash
        run: |
          terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "task_definition=$(terraform output -raw ecs_task_definition_arn)" >> "$GITHUB_OUTPUT"
          echo "security_group=$(terraform output -raw ecs_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "subnets=$(terraform output -json ecs_subnet_ids | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "application_url=$(terraform output -raw application_url)" >> "$GITHUB_OUTPUT"

      - name: Configure application deployment credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify target backend image
        env:
          TASK_DEFINITION: ${{ steps.infra.outputs.task_definition }}
        shell: bash
        run: |
          image_uri=$(aws ecs describe-task-definition             --task-definition "$TASK_DEFINITION"             --query 'taskDefinition.containerDefinitions[?name==`backend`].image | [0]'             --output text)
          echo "Production task definition image: $image_uri"
          expected_tag="sha-${EXPECTED_BACKEND_IMAGE_SHA}"
          if [[ "$image_uri" != *":${expected_tag}" ]]; then
            echo "Refusing recovery deployment: expected backend image tag ${expected_tag}." >&2
            exit 1
          fi

      - name: Run Flyway migrations in Fargate
        shell: bash
        env:
          CLUSTER: ${{ steps.infra.outputs.cluster }}
          TASK_DEFINITION: ${{ steps.infra.outputs.task_definition }}
          SECURITY_GROUP: ${{ steps.infra.outputs.security_group }}
          SUBNETS: ${{ steps.infra.outputs.subnets }}
        run: |
          network_configuration=$(jq -cn             --argjson subnets "$SUBNETS"             --arg security_group "$SECURITY_GROUP"             '{awsvpcConfiguration:{subnets:$subnets,securityGroups:[$security_group],assignPublicIp:"ENABLED"}}')
          overrides='{"containerOverrides":[{"name":"backend","command":["--spring.main.web-application-type=none","--spring.main.banner-mode=off","--perkhaven.migration-only=true","--perkhaven.scheduling.enabled=false","--perkhaven.storage.provider=local"]}]}'
          run_task_response=$(aws ecs run-task             --cluster "$CLUSTER"             --launch-type FARGATE             --task-definition "$TASK_DEFINITION"             --network-configuration "$network_configuration"             --overrides "$overrides")
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<< "$run_task_response")
          if [[ -z "$task_arn" ]]; then
            echo "ECS did not start the migration task."
            jq '.failures' <<< "$run_task_response"
            exit 1
          fi
          if ! timeout 15m aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"; then
            echo "Migration task did not stop within 15 minutes." >&2
            aws ecs stop-task --cluster "$CLUSTER" --task "$task_arn" --reason "Recovery migration timeout" >/dev/null 2>&1 || true
            exit 1
          fi
          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn"             --query 'tasks[0].containers[?name==`backend`].exitCode | [0]' --output text)
          reason=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn"             --query 'tasks[0].stoppedReason' --output text)
          echo "Migration task stopped: ${reason}; exit code: ${exit_code}"
          if [[ "$exit_code" != "0" ]]; then
            log_stream=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn"               --query 'tasks[0].containers[?name==`backend`].logStreamName | [0]' --output text)
            log_group=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION"               --query 'taskDefinition.containerDefinitions[?name==`backend`].logConfiguration.options."awslogs-group" | [0]' --output text)
            if [[ "$log_stream" != "None" && "$log_group" != "None" ]]; then
              aws logs get-log-events --log-group-name "$log_group" --log-stream-name "$log_stream"                 --limit 100 --query 'events[*].message' --output text || true
            fi
            exit 1
          fi

      - name: Deploy backend service
        env:
          CLUSTER: ${{ steps.infra.outputs.cluster }}
          SERVICE: ${{ steps.infra.outputs.service }}
          TASK_DEFINITION: ${{ steps.infra.outputs.task_definition }}
        run: |
          aws ecs update-service             --cluster "$CLUSTER"             --service "$SERVICE"             --task-definition "$TASK_DEFINITION"             --desired-count 1             --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Verify production backend
        env:
          APPLICATION_URL: ${{ steps.infra.outputs.application_url }}
        run: |
          curl --fail --retry 18 --retry-delay 10 --retry-all-errors "${APPLICATION_URL}/actuator/health/readiness"
